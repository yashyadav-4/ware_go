services:
  app:
    image: ware_go:latest
    container_name: ware_go_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/ware_go?sslmode=disable
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=redpanda:9092
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - ware_go_net

  postgres:
    image: postgres:16-alpine
    container_name: ware_go_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ware_go
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ware_go"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ware_go_net

  redis:
    image: redis:7-alpine
    container_name: ware_go_redis_prod
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ware_go_net

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.2
    container_name: ware_go_redpanda_prod
    restart: unless-stopped
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda_prod_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ware_go_net

volumes:
  postgres_prod_data:
  redis_prod_data:
  redpanda_prod_data:

networks:
  ware_go_net:
    driver: bridge