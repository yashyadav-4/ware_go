version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: Ware_Go_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword 
      - POSTGRES_DB=ware_go
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data 
    healthcheck:
      test: ["CMD-SHELL" , "pg_isready -U postgres -d ware_go"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  redis:
    image: redis:7-alpine
    container_name: Ware_Go_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD" , "redis-cli" , "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.8
    container_name: Ware_Go_redpanda
    restart: unless-stopped
    command:
      - redpanda start
      - --smp 1 # symmetric multiprocessing -> limits at max 1 thread out of my 12 threads 
      - --memory 512M #can consume at max 512mb ram
      - --reserve-memory 0M #tells redpanda to not lock os memory in advance
      - --overprovisioned #for local development to tell redpanda its not a server and not overconsume resources
      - --node-id 0 #id of our kafka broker
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:19092 # main place where we get which broker is handling which partition
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:19092 # our partition port
    ports:
      - "19092:19092" #normal message port
      - "9644:9644" #admin port
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: Ware_Go_prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  grafana:
    image: grafana/grafana:11.2.0
    container_name: Ware_Go_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
volumes:
  postgres_data:
  redis_data:
  redpanda_data:
  prometheus_data:
  grafana_data: 